{{/* Deployment du serveur Redis leader. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-leader
spec:
  replicas: {{ .Values.redisLeader.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "guestbook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-leader
  template:
    metadata:
      labels:
        {{- include "guestbook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-leader
    spec:
      containers:
        - name: redis-leader
          image: "{{ .Values.redisLeader.image.repository }}:{{ .Values.redisLeader.image.tag }}"
          imagePullPolicy: {{ .Values.redisLeader.image.pullPolicy }}
          command:
            - redis-server
          args:
            - /usr/local/etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: {{ .Values.redisLeader.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.redisLeader.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /usr/local/etc/redis
              readOnly: true
      volumes:
        - name: redis-data
          {{- if .Values.redisLeader.persistence.enabled }}
          persistentVolumeClaim:
            claimName: redis-leader-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: redis-config
          configMap:
            name: redis-leader-config
