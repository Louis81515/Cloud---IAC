apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-follower
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-follower
    app.kubernetes.io/part-of: livre-or-cloud
spec:
  replicas: 2
  # stratégie : RollingUpdate par défaut pour du ha
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: redis-follower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: redis-follower
        app.kubernetes.io/part-of: livre-or-cloud
    spec:
      containers:
        - name: redis-follower
          image: us-docker.pkg.dev/google-samples/containers/gke/gb-redis-follower:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            #le temps qu'on laisse au conteneur pour se lancer
            initialDelaySeconds: 5
            #frequence de verification
            periodSeconds: 5
            #durée maximale d'un test avant qu'on le considérer comme un echec
            timeoutSeconds: 2
            #nombre d'echec avant d'agir
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 256m
              memory: 256Mi