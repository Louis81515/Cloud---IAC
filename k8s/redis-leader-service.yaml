apiVersion: v1
kind: Service
metadata:
  name: redis-leader
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
    app.kubernetes.io/part-of: livre-or-cloud
spec:
  type: ClusterIP #on ne veut pas exposer le service à l'extérieur du cluster
  selector:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
  ports:
    - name: redis
      port: 6379
      targetPort: redis