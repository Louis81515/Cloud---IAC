apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
    app.kubernetes.io/part-of: livre-or-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate #Volume en RWO 1 nod a la fois
  selector:
    matchLabels: # labels stables uniquement
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: redis-leader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: redis-leader 
    spec:
      containers:
        - name: redis-leader
          image: docker.io/redis:6.0.5
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis/
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-leader-data
        - name: config
          configMap:
            name: redis-leader-config